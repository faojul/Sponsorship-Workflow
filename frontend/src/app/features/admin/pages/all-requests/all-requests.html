<header class="page-head">
  <div>
    <h1 class="page-title">All Sponsorship Requests</h1>
    <p class="page-sub">Every sponsorship request in the system.</p>
  </div>
</header>

<mat-card class="panel">
<div class="table-container">
  <table
    mat-table
    [dataSource]="requests"
    class="full-width-table data-table">

    <ng-container matColumnDef="title">

      <th mat-header-cell *matHeaderCellDef>
        Title
      </th>

      <td mat-cell *matCellDef="let item" class="cell-strong">
        {{ item.title }}
      </td>

    </ng-container>

    <ng-container matColumnDef="department">

      <th mat-header-cell *matHeaderCellDef>
        Department
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.department }}
      </td>

    </ng-container>

    <ng-container matColumnDef="status">

      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let item">
        <span class="chip" [attr.data-status]="item.status">{{ item.status | humanize }}</span>
      </td>

    </ng-container>

    <ng-container matColumnDef="amount">

      <th mat-header-cell *matHeaderCellDef class="num">
        Amount
      </th>

      <td mat-cell *matCellDef="let item" class="num">
        {{ item.requestedAmount | number:'1.0-2' }}
      </td>

    </ng-container>

    <ng-container matColumnDef="workflow">

      <th mat-header-cell *matHeaderCellDef class="col-actions">
        Workflow
      </th>

      <td mat-cell *matCellDef="let item" class="col-actions">

        <button
          mat-stroked-button
          class="btn-sm"
          [routerLink]="[
            '/workflow-history',
            item.id
          ]">

          View Workflow
        </button>

      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="
        let row;
        columns: displayedColumns;
      ">
    </tr>

    <tr class="empty-row" *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">
        <div class="empty-state">
          <span class="material-icons" aria-hidden="true">inbox</span>
          <strong>No requests yet</strong>
          Requests from all users will appear here.
        </div>
      </td>
    </tr>

  </table>
</div>
</mat-card>
