<h2>Sponsorship Types</h2>

<div class="top-bar">

  <mat-form-field appearance="outline">

    <mat-label>
      New Type Name
    </mat-label>

    <input
      matInput
      [(ngModel)]="newName">

  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    (click)="add()">

    Add
  </button>

</div>

<table
  mat-table
  [dataSource]="types"
  class="full-width-table">

  <ng-container matColumnDef="name">

    <th mat-header-cell *matHeaderCellDef>
      Name
    </th>

    <td mat-cell *matCellDef="let item">

  <mat-form-field
    appearance="outline"
    class="type-input">

    <input
      matInput
      [(ngModel)]="item.name">

  </mat-form-field>

</td>

  </ng-container>

  <ng-container matColumnDef="actions">

    <th mat-header-cell *matHeaderCellDef>
      Actions
    </th>

    <td mat-cell *matCellDef="let item">

      <button
        mat-button
        color="primary"
        (click)="update(item)">

        Update
      </button>

      <button
        mat-button
        color="warn"
        (click)="delete(item.id)">

        Delete
      </button>

    </td>

  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="
      let row;
      columns: displayedColumns;
    ">
  </tr>

</table>
