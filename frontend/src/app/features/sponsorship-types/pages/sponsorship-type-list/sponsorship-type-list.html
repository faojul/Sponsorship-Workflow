<header class="page-head">
  <div>
    <h1 class="page-title">Sponsorship Types</h1>
    <p class="page-sub">Manage the types requestors can choose from.</p>
  </div>
</header>

<div class="panel add-panel">

  <div class="top-bar">

    <mat-form-field appearance="outline" class="new-type" subscriptSizing="dynamic">

      <mat-label>
        New Type Name
      </mat-label>

      <input
        matInput
        [(ngModel)]="newName">

    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      (click)="add()">

      Add
    </button>

  </div>

</div>

<div class="panel">
<div class="table-container">
<table
  mat-table
  [dataSource]="types"
  class="full-width-table data-table">

  <ng-container matColumnDef="name">

    <th mat-header-cell *matHeaderCellDef>
      Name
    </th>

    <td mat-cell *matCellDef="let item">

  <mat-form-field
    appearance="outline"
    class="type-input"
    subscriptSizing="dynamic">

    <input
      matInput
      [(ngModel)]="item.name">

  </mat-form-field>

</td>

  </ng-container>

  <ng-container matColumnDef="actions">

    <th mat-header-cell *matHeaderCellDef class="col-actions">
      Actions
    </th>

    <td mat-cell *matCellDef="let item" class="col-actions">

      <div class="row-actions">

        <button
          mat-stroked-button
          class="btn-sm"
          (click)="update(item)">

          Update
        </button>

        <button
          mat-stroked-button
          class="btn-sm btn-danger"
          (click)="delete(item.id)">

          Delete
        </button>

      </div>

    </td>

  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns">
  </tr>

  <tr
    mat-row
    *matRowDef="
      let row;
      columns: displayedColumns;
    ">
  </tr>

  <tr class="empty-row" *matNoDataRow>
    <td [attr.colspan]="displayedColumns.length">
      <div class="empty-state">
        <span class="material-icons" aria-hidden="true">category</span>
        <strong>No sponsorship types yet</strong>
        Add the first type using the field above.
      </div>
    </td>
  </tr>

</table>
</div>
</div>
