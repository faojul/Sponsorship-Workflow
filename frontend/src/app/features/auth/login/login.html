<div class="page-wrapper">
  
  <!-- Title explicitly placed at the top -->
  <h1 class="page-title">Sponsorship Workflow Login</h1>

  <!-- Full Screen Loading Overlay -->
  @if (isLoading) {
    <div class="loading-overlay">
      <div class="server-start-notice">
        <mat-spinner diameter="50"></mat-spinner>
        <h3>Initializing ...</h3>
        <p>
          First request may take up to 60 seconds.
        </p>
      </div>
    </div>
  }

  <!-- Center Content Area for Cards -->
  <div class="login-container">

    <!-- Main Login Card -->
    <mat-card class="login-card">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="full-width"
          [disabled]="isLoading">
          @if (!isLoading) {
            <span>Login</span>
          } @else {
            <span>Initializing Server...</span>
          }
        </button>
      </form>
    </mat-card>

    <!-- Seed Data Test Accounts Card -->
    <mat-card class="seed-card">
      <h3>Test Accounts</h3>
      <p><strong>Requestor</strong><br>requestor@test.com<br>Test123!</p>
      <p><strong>Manager</strong><br>manager@test.com<br>Test123!</p>
      <p><strong>Finance Admin</strong><br>finance@test.com<br>Test123!</p>
      <p><strong>System Admin</strong><br>admin@test.com<br>Test123!</p>
    </mat-card>

  </div>
</div>
