<mat-card>

  <h2>Create Sponsorship Request</h2>

  <form [formGroup]="form">

    <div class="grid">

      <mat-form-field appearance="outline">

        <mat-label>
          Title
        </mat-label>

        <input
          matInput
          formControlName="title">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>
          Department
        </mat-label>

        <input
          matInput
          formControlName="department">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>
          Sponsorship Type
        </mat-label>

        <mat-select
          formControlName="sponsorshipTypeId">

          @for (
            item of sponsorshipTypes;
            track item.id
          ) {

            <mat-option
              [value]="item.id">

              {{ item.name }}

            </mat-option>
          }

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>
          Event Name
        </mat-label>

        <input
          matInput
          formControlName="eventName">

      </mat-form-field>

<mat-form-field appearance="outline">
  <mat-label>Event Date</mat-label>
  
  <!-- Add [matDatepicker] directive to the input -->
  <input 
    matInput 
    [matDatepicker]="picker" 
    formControlName="eventDate">
  
  <!-- Add a toggle icon inside the form field -->
  <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
  
  <!-- Add the actual calendar popup element -->
  <mat-datepicker #picker></mat-datepicker>
</mat-form-field>


      <mat-form-field appearance="outline">

        <mat-label>
          Requested Amount
        </mat-label>

        <input
          matInput
          type="number"
          formControlName="requestedAmount">

      </mat-form-field>

    </div>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>
        Purpose
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="purpose">
      </textarea>

    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>
        Expected Business Benefit
      </mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="expectedBusinessBenefit">
      </textarea>

    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>
        Remarks
      </mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="remarks">
      </textarea>

    </mat-form-field>

    <div class="actions">

      <button
        mat-raised-button
        color="primary"
        (click)="saveDraft()">

        Save Draft
      </button>

    </div>

  </form>

</mat-card>
