<mat-card>

  <div class="header">

    <h2>My Requests</h2>

    <button
      mat-raised-button
      color="primary"
      routerLink="/requests/create">

      Create Request
    </button>

  </div>

  <table
  mat-table
  [dataSource]="requests || []"
  class="full-width-table">

    <ng-container matColumnDef="title">

      <th mat-header-cell *matHeaderCellDef>
        Title
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.title }}
      </td>

    </ng-container>

    <ng-container matColumnDef="department">

      <th mat-header-cell *matHeaderCellDef>
        Department
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.department }}
      </td>

    </ng-container>

    <ng-container matColumnDef="status">

      <th mat-header-cell *matHeaderCellDef>
        Status
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.status }}
      </td>

    </ng-container>

    <ng-container matColumnDef="amount">

      <th mat-header-cell *matHeaderCellDef>
        Amount
      </th>

      <td mat-cell *matCellDef="let item">
        {{ item.requestedAmount }}
      </td>

    </ng-container>

    <ng-container matColumnDef="actions">

      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>

      <td mat-cell *matCellDef="let item">
@if (item.status === 'Draft') {
<button
  mat-button
  color="accent"
  (click)="submit(item.id)">

  Submit
</button>
}
@if (item.status === 'Draft' || item.status === 'PendingManagerApproval') {
<button
  mat-button
  color="warn"
  (click)="cancel(item.id)">

  Cancel
</button>
}
      </td>

    </ng-container>

    <tr
      mat-header-row
      *matHeaderRowDef="displayedColumns">
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;">
    </tr>

  </table>

</mat-card>
